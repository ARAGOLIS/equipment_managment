<div>
    <h3 class="font-bold text-2xl mb-6">
        <i class="fas fa-exchange-alt mr-2"></i>Передача оборудования
    </h3>

    <form method="post"
          hx-post="{{ request.path }}"
          hx-target="#equipment-table"
          hx-swap="innerHTML"
          class="space-y-4">
        {% csrf_token %}

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="form-control">
                <label class="label">
                    <span class="label-text font-medium">Оборудование</span>
                </label>
                <input type="text" class="input input-bordered" value="{{ equipment.name }}" readonly>
            </div>

            <div class="form-control">
                <label class="label">
                    <span class="label-text font-medium">Текущее местоположение</span>
                </label>
                <input type="text" class="input input-bordered" value="{{ equipment.location.name }}" readonly>
            </div>

            {% for field in form %}
                {% if field.name != 'equipment' and field.name != 'from_location' %}
                <div class="form-control">
                    <label class="label">
                        <span class="label-text font-medium">{{ field.label }}</span>
                        {% if field.field.required %}
                        <span class="label-text-alt text-error">*</span>
                        {% endif %}
                    </label>

                    {{ field }}

                    {% if field.help_text %}
                    <label class="label">
                        <span class="label-text-alt text-gray-500">{{ field.help_text }}</span>
                    </label>
                    {% endif %}

                    {% if field.errors %}
                    <div class="text-error text-sm mt-1">
                        {% for error in field.errors %}
                        <span><i class="fas fa-exclamation-circle mr-1"></i>{{ error }}</span>
                        {% endfor %}
                    </div>
                    {% endif %}
                </div>
                {% endif %}
            {% endfor %}
        </div>

        <div class="modal-action">
            <button type="button"
                    onclick="closeModal()"
                    class="btn btn-ghost">
                <i class="fas fa-times mr-2"></i>Отмена
            </button>
            <button type="submit"
                    class="btn btn-primary">
                <i class="fas fa-check mr-2"></i>Подтвердить передачу
            </button>
        </div>
    </form>
</div>
