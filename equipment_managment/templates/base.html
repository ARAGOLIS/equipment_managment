<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title >Учёт оборудования</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@3.9.4/dist/full.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .htmx-indicator {
            opacity: 0;
            transition: opacity 200ms ease-in;
        }
        .htmx-request .htmx-indicator {
            opacity: 1;
        }
        .htmx-request.htmx-indicator {
            opacity: 1;
        }
    </style>
</head>
<body class="min-h-screen" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    <header class="bg-base-200 p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold text-primary" >
                <a href="{% url 'dashboard:dashboard' %}" class="hover:text-primary">Учет оборудования</a>
            </h1>
            <nav>
                <ul class="flex space-x-6">
                    <li><a href="{% url 'employees:list' %}" class="hover:text-primary">Сотрудники</a></li>
                    <li><a href="{% url 'equipment:list' %}" class="hover:text-primary">Оборудование</a></li>
                    <li><a href="{% url 'maintenance:plan_list' %}" class="hover:text-primary">Обслуживание</a></li>
                    <li><a href="{% url 'admin:index' %}" class="hover:text-primary">Админ-панель</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container mx-auto p-4">
        {% block content %}{% endblock %}
    </main>

    <div id="modal" class="modal" hidden>
        <div class="modal-backdrop" onclick="closeModal()"></div>
        <div class="modal-box max-w-5xl" id="modal-content">
            <!-- Контент модального окна будет здесь -->
        </div>
    </div>

    <div id="toast" class="toast toast-end z-50">
        <div id="toast-notification" class="alert hidden">
            <span id="toast-message"></span>
        </div>
    </div>

    <script>
        // Универсальный скрипт для кнопок очистки фильтров
        document.addEventListener('DOMContentLoaded', function() {
            initFilterButtons();

            // Инициализация при HTMX-обновлениях
            if (typeof htmx !== 'undefined') {
                document.body.addEventListener('htmx:afterSwap', function() {
                    initFilterButtons();
                });
            }
        });

        function initFilterButtons() {
            // Находим все поля ввода с кнопками очистки
            document.querySelectorAll('.form-control input[type="text"], .form-control select').forEach(input => {
                const clearBtn = input.nextElementSibling;

                // Проверяем, есть ли рядом кнопка очистки
                if (clearBtn && clearBtn.classList.contains('absolute')) {
                    // Функция для обновления состояния кнопки
                    function updateClearButton() {
                        if (input.value.trim() !== '') {
                            clearBtn.classList.remove('opacity-0', 'cursor-default');
                            clearBtn.classList.add('hover:text-gray-600');
                            clearBtn.onclick = function() {
                                input.value = '';
                                input.focus();
                                updateClearButton();
                                if (typeof htmx !== 'undefined' && input.hasAttribute('hx-get')) {
                                    htmx.trigger(input, 'keyup');
                                }
                            };
                        } else {
                            clearBtn.classList.add('opacity-0', 'cursor-default');
                            clearBtn.classList.remove('hover:text-gray-600');
                            clearBtn.onclick = null;
                        }
                    }

                    // Инициализация состояния кнопки
                    updateClearButton();

                    // Обработчик изменения значения
                    input.addEventListener('input', updateClearButton);
                }
            });
        }

        // Модальные окна
        htmx.on('htmx:afterSwap', function(evt) {
            if (evt.detail.target.id === 'modal-content') {
                const modal = document.getElementById('modal');
                modal.classList.add('modal-open');
                modal.removeAttribute('hidden')
            }
        });

        htmx.on('closeModal', function() {
            const modal = document.getElementById('modal');
            modal.classList.remove('modal-open');
            modal.setAttribute('hidden', 'true');
        });

        // Уведомления
        htmx.on('showToast', function(evt) {
            const toast = document.getElementById('toast-notification');
            const message = evt.detail.message;
            const type = evt.detail.type || 'info';

            toast.className = `alert alert-${type} show`;
            document.getElementById('toast-message').textContent = message;
            toast.hidden = false;

            setTimeout(() => {
                toast.className = 'alert hidden';
            }, 3000);
        });

        function openModal() {
            document.getElementById('modal').hidden = false;
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('modal').hidden = true;
            document.body.style.overflow = 'auto';
        }
    </script>
</body>
</html>
