<table class="table table-zebra w-full">
    <thead>
        <tr>
            <th>ФИО</th>
            <th>Отдел</th>
            <th>Email</th>
            <th>Телефон</th>
            <th>Действия</th>
        </tr>
    </thead>
    <tbody>
        {% for employee in employees %}
        <tr>
            <td>{{ employee.first_name }} {{ employee.last_name }}</td>
            <td>{{ employee.department.name|default:"-" }}</td>
            <td>{{ employee.email }}</td>
            <td>{{ employee.phone|default:"-" }}</td>

            <td class="flex gap-2">
                <button hx-get="{% url 'employees:update' employee.id %}"
                        hx-target="#form-container"
                        class="btn btn-sm btn-outline">
                        Редактировать
                </button>
                <button hx-delete="{% url 'employees:delete' employee.id %}"
                    hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
                    hx-confirm="Удалить сотрудника {{ employee.first_name }} {{ employee.last_name }}?"
                    hx-target="closest tr"
                    hx-swap="outerHTML"
                    class="btn btn-sm btn-error">
                Удалить
            </button>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
