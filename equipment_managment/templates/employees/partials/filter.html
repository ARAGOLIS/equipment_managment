<form hx-get="{% url 'employees:employee_filter' %}"
      hx-target="#employee-table"
      hx-trigger="change, keyup delay:500ms"
      class="grid grid-cols-1 md:grid-cols-2 gap-4">



<form hx-get="{% url 'employees:employee_filter' %}"
      hx-target="#employees-table-container"
      hx-trigger="input changed delay:1000ms"
      class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">

    <!-- Фильтр по ФИО -->
    <div class="form-control">
        <label class="label">
            <span class="label-text">ФИО сотрудника</span>
        </label>
        <div class="relative">
            <input type="text"
                   name="full_name"
                   placeholder="ФИО"
                   value="{{ request.GET.full_name|default:'' }}"
                   class="input input-bordered w-full pl-10"
                   minlength="2"
                   maxlength="100">
            <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
        </div>
    </div>

    <div class="form-control">
        <label class="label">
            <span class="label-text">Отдел</span>
        </label>
        <select name="department" class="select select-bordered">
            <option value="">Все отделы</option>
            {% for department in departments %}
            <option value="{{ department.id }}" {% if request.GET.department == department.id|stringformat:"s" %}selected{% endif %}>
                {{ department.name }}
            </option>
            {% endfor %}
        </select>
    </div>




</form>
