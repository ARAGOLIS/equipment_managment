<div id="form-container">
    <h3 class="font-bold text-lg mb-4">
        {% if is_edit %}Редактирование{% else %}Добавление{% endif %} сотрудника
    </h3>
    <form method="post"
          hx-post="{{ request.path }}"
          hx-target="#form-container"
          hx-swap="outerHTML">
        {% csrf_token %}
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
            {% for field in form %}
            <div class="form-control">
                <label class="label">
                    <span class="label-text">{{ field.label }}</span>
                </label>
                {{ field }}
                {% if field.errors %}
                <div class="text-error text-sm mt-1">
                    {{ field.errors }}
                    {% if field.name == 'email' and email_error %}
                        <div class="text-error">{{ email_error }}</div>
                    {% endif %}
                </div>
                {% endif %}
            </div>
            {% endfor %}
        </div>
        <div class="modal-action">
            <button type="submit" class="btn btn-primary">
                {% if is_edit %}Обновить{% else %}Создать{% endif %}
            </button>
            <!-- Кнопка отмены -->
            <button type="button"
                    onclick="event.preventDefault(); htmx.trigger('body', 'closeModal')"
                    class="btn">Отмена
            </button>


        </div>
    </form>
</div>
