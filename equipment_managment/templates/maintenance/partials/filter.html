<form hx-get="{% url 'maintenance:plan_filter' %}"
      hx-target="#maintenance-table"
      hx-trigger="change, keyup delay:500ms"
      class="grid grid-cols-1 md:grid-cols-4 gap-4">

    <!-- Фильтр по оборудованию -->
    <div class="form-control">
        <label class="label">
            <span class="label-text">Оборудование</span>
        </label>
        <div class="relative">
            <input type="text"
                   name="equipment"
                   id="equipment_input"
                   placeholder="Название или серийник..."
                   value="{{ request.GET.equipment|default:'' }}"
                   class="input input-bordered w-full pr-10"
                   hx-get="{% url 'maintenance:plan_filter' %}"
                   hx-target="#maintenance-table"
                   hx-trigger="keyup changed delay:1000ms"
                   data-filter-input
                   data-clear-btn="clear_equipment_btn">  <!-- Укажите ID кнопки -->


            <button type="button"
                    id="clear_equipment_btn"
                    class="absolute right-3 top-3 text-gray-400 hover:text-gray-600 transition-colors
                           {% if not request.GET.equipment %}opacity-0 cursor-default{% endif %}">
                <i class="fas fa-times-circle"></i>
            </button>
        </div>
    </div>

        <!-- Фильтр по ответственному -->
    <div class="form-control">
        <label class="label">
            <span class="label-text">Оборудование</span>
        </label>
        <div class="relative">
            <input type="text"
                   name="assigned_to"
                   id="assigned_to_input"
                   placeholder="Имя или фамилия..."
                   value="{{ request.GET.assigned_to|default:'' }}"
                   class="input input-bordered w-full pr-10"
                   hx-get="{% url 'maintenance:plan_filter' %}"
                   hx-target="#maintenance-table"
                   hx-trigger="keyup changed delay:1000ms"
                   data-filter-input
                   data-clear-btn="clear_assigned_btn">  <!-- Укажите ID кнопки -->

            <button type="button"
                    id="clear_assigned_btn"
                    class="absolute right-3 top-3 text-gray-400 hover:text-gray-600 transition-colors
                           {% if not request.GET.equipment %}opacity-0 cursor-default{% endif %}">
                <i class="fas fa-times-circle"></i>
            </button>
        </div>
    </div>

    <!-- Фильтр по типу ТО -->
    <div class="form-control">
        <label class="label">
            <span class="label-text">Тип ТО</span>
        </label>
        <select name="maintenance_type" class="select select-bordered">
            <option value="">Все типы</option>
            {% for type in maintenance_types %}
            <option value="{{ type.id }}" {% if request.GET.maintenance_type == type.id|stringformat:"s" %}selected{% endif %}>
                {{ type.name }}
            </option>
            {% endfor %}
        </select>
    </div>


    <!-- Фильтр по статусу -->
    <div class="form-control">
        <label class="label">
            <span class="label-text">Статус</span>
        </label>
        <select name="status" class="select select-bordered">
            <option value="">Все статусы</option>
            {% for status in status_choices %}
            <option value="{{ status.0 }}" {% if request.GET.status == status.0 %}selected{% endif %}>
                {{ status.1 }}
            </option>
            {% endfor %}
        </select>
    </div>
</form>
